<script id="pages" type="application/json">{"order":["01-challenge-brief","02-rules-and-submission","03-architecture","05-global-offers"],"pages":{"01-challenge-brief":{"en":{"title":"1. Challenge brief","md":"# 1. Challenge brief\n\n**Event:** 2026 NASA Space Apps Challenge, November 14-15, 2026\n**Challenge:** Field Shift: Adapting Farms with NASA Data\n**Difficulty:** Intermediate / Advanced. **Subjects:** Earth Science, Software, Arts & Multimedia\n**Team:** InnoHuando\n**Official page:** \u003chttps://www.spaceappschallenge.org/2026/challenges/adapting-farms-with-nasa-data/>\n\n## The ask, in one sentence\n\nBuild a decision-support tool that combines NASA Earth observations with local soil information, crop characteristics and farmer priorities, so that farmers can explore crop-rotation strategies that strengthen soil health and adapt the farm to changing weather and water conditions.\n\n## What the statement actually asks for\n\nEverything in the statement is phrased as \"you may\", so nothing below is a hard requirement. Read together, though, it describes what a strong answer looks like.\n\n| # | Element | Source in the statement |\n|---|---------|-------------------------|\n| 1 | Use NASA Earth observations as a core input (SMAP, ECOSTRESS, GPM, Landsat, MODIS, NASA POWER, GRACE/GRACE-FO, SRTM) | Objectives |\n| 2 | Analyze temperature, heat stress, rainfall, soil moisture, evaporation, frost risk, extreme precipitation, vegetation stress, long-term water trends | Objectives |\n| 3 | Combine with local soil data, crop traits and farmer priorities (water use, forage value, nitrogen fixation, erosion reduction, organic matter, market fit) | Objectives |\n| 4 | Show when fields are usually bare and when current crops look most vulnerable | Objectives |\n| 5 | **Compare at least three rotation strategies, one of them the existing rotation** | Objectives |\n| 6 | For each strategy explain: why it was suggested, the evidence, the benefits, the information gaps, the risks needing local review | Objectives |\n| 7 | Stay a supportive tool: it never replaces farmer judgment or local expertise | Objectives |\n\nItems 5, 6 and 7 are the heart of the challenge. A tool that only shows maps and charts does not answer it.\n\n## Optional considerations grouped by the statement\n\n- **Understanding conditions and data.** Explain terms such as evapotranspiration, soil-moisture anomaly, NDVI, frost risk and water balance in plain language. Explain how satellite observations differ from ground measurements.\n- **Modeling and data fusion.** Compare statistical or machine-learning approaches, say how uncertainty is handled, and harmonize datasets of different resolutions onto one analysis grid.\n- **Rotation strategy exploration.** Compare scenarios on nutrient cycling, erosion, organic matter, pest-cycle disruption, water use, forage and market. Map strategies to the farmer's priorities. Explain the role of legumes, cover crops, deep-rooting and drought-tolerant crops.\n- **Geospatial mapping.** Interactive maps of long-term trends, field-level vulnerability zones, timelines, overlays, scenario sliders for rainfall or temperature.\n- **Farmer-centered design.** Readable by people with little technical background, lets the farmer enter priorities and constraints (water, equipment, market), and keeps reminding the user where human judgment matters.\n\n## A note on vocabulary\n\nThe Space Apps site writes \"SI\" (Super Intelligence) where most people write \"AI\". Its FAQ says this follows a U.S. Executive Order of September 29, 2026. We use the site's term on the submission form and \"AI/ML\" in our own technical notes.\n\n## What the official Resources tab offers\n\nThe tab lists 24 resources. They fall into three groups, and the grouping matters for where we pilot.\n\n**Global coverage (usable anywhere, including Peru)**\n\n| Resource | What it gives | Link |\n|----------|---------------|------|\n| SMAP | Surface soil moisture and freeze/thaw every 2-3 days | \u003chttps://www.earthdata.nasa.gov/data/platforms/space-based-platforms/smap> |\n| GPM / IMERG | Precipitation rate and accumulation | \u003chttps://gpm.nasa.gov/data> |\n| Landsat | 30 m reflectance, NDVI, bare ground | \u003chttps://earthexplorer.usgs.gov/> |\n| MODIS / VIIRS | 250-1000 m vegetation indices | \u003chttps://lpdaac.usgs.gov/products/> |\n| NASA POWER | Agroclimatology: temperature, humidity, radiation, derived indicators | \u003chttps://power.larc.nasa.gov/> |\n| SRTM | Elevation, slope, runoff, erosion risk | \u003chttps://www.earthdata.nasa.gov/data/instruments/srtm> |\n| ECOSTRESS | Land-surface temperature and evapotranspiration at fine scale | \u003chttps://ecostress.jpl.nasa.gov/data> |\n| GLDAS | Assimilated temperature, rain, soil moisture, ET proxies | \u003chttps://www.earthdata.nasa.gov/> |\n| GEDI | Canopy height and biomass (best over tall vegetation) | \u003chttps://gedi.umd.edu/data> |\n| FAO GAEZ | Crop suitability, soil constraints, yield potential | \u003chttps://gaez.fao.org/> |\n| Copernicus Sentinel-2 (ESA) | 10-20 m multispectral imagery | \u003chttps://dataspace.copernicus.eu/> |\n| ERA5 (ECMWF) | Hourly reanalysis climate variables | \u003chttps://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels> |\n\n**United States only**\n\nUSDA Ag Data Commons, Web Soil Survey, Cropland Data Layer (CropScape), PRISM, SSURGO/STATSGO2, NAIP, NLCD, NLDAS, NWIS, USDA AMS Market News, NASS QuickStats, OpenET (western states), LANDFIRE.\n\n**North America only**\n\nCoCoRaHS crowd-sourced rainfall.\n\n### Why this matters\n\nMore than half of the listed resources cover only the United States. A pilot in Peru can use every NASA mission dataset, but has to replace the U.S. soil, crop-map, price and station sources with Peruvian or global equivalents. See [6. Open decisions](06-open-decisions.md).\n\n## Sources\n\n- Challenge statement and Resources tab, read on 2026-11-14: \u003chttps://www.spaceappschallenge.org/2026/challenges/adapting-farms-with-nasa-data/?tab=resources>\n- Participant FAQs: \u003chttps://www.spaceappschallenge.org/resources/participant-faqs/>\n"},"es":{"title":"1. Resumen del reto","md":"# 1. Resumen del reto\n\n**Evento:** NASA Space Apps Challenge 2026, 14 y 15 de noviembre de 2026\n**Reto:** Field Shift: Adapting Farms with NASA Data (Desplazamiento de campo: adaptando granjas con datos de la NASA)\n**Dificultad:** Intermedia / Avanzada. **Temas:** Ciencias de la Tierra, Software, Artes y Multimedia\n**Equipo:** InnoHuando\n**Página oficial:** \u003chttps://www.spaceappschallenge.org/2026/challenges/adapting-farms-with-nasa-data/>\n\n## El pedido, en una frase\n\nConstruir una herramienta de apoyo a la decisión que combine observaciones terrestres de la NASA con información local de suelo, características de los cultivos y prioridades del agricultor, para que este pueda explorar estrategias de rotación que fortalezcan la salud del suelo y adapten la chacra a los cambios de clima y agua.\n\n## Qué pide realmente el enunciado\n\nTodo el enunciado está redactado como \"puedes\", así que nada de lo siguiente es obligatorio. Leído en conjunto, sin embargo, describe cómo se ve una buena respuesta.\n\n| # | Elemento | Dónde aparece |\n|---|----------|---------------|\n| 1 | Usar observaciones terrestres de la NASA como insumo central (SMAP, ECOSTRESS, GPM, Landsat, MODIS, NASA POWER, GRACE/GRACE-FO, SRTM) | Objetivos |\n| 2 | Analizar temperatura, estrés térmico, lluvia, humedad del suelo, evaporación, riesgo de heladas, lluvias extremas, estrés vegetal y tendencias hídricas de largo plazo | Objetivos |\n| 3 | Combinar con datos locales de suelo, rasgos de cultivos y prioridades del agricultor (uso de agua, valor forrajero, fijación de nitrógeno, reducción de erosión, materia orgánica, mercado) | Objetivos |\n| 4 | Mostrar cuándo los campos suelen estar desnudos y cuándo los cultivos actuales se ven más vulnerables | Objetivos |\n| 5 | **Comparar al menos tres estrategias de rotación, una de ellas la rotación actual** | Objetivos |\n| 6 | Para cada estrategia explicar: por qué se sugirió, la evidencia, los beneficios, los vacíos de información y los riesgos que requieren revisión local | Objetivos |\n| 7 | Ser una herramienta de apoyo: nunca reemplaza el juicio del agricultor ni la experiencia local | Objetivos |\n\nLos puntos 5, 6 y 7 son el corazón del reto. Una herramienta que solo muestra mapas y gráficos no lo responde.\n\n## Consideraciones opcionales, agrupadas como en el enunciado\n\n- **Entender las condiciones y los datos.** Explicar en lenguaje simple términos como evapotranspiración, anomalía de humedad del suelo, NDVI, riesgo de heladas y balance hídrico. Explicar en qué se diferencian las observaciones satelitales de las mediciones en tierra.\n- **Modelado y fusión de datos.** Comparar enfoques estadísticos o de aprendizaje automático, decir cómo se maneja la incertidumbre y armonizar datos de distinta resolución en una sola grilla de análisis.\n- **Exploración de estrategias de rotación.** Comparar escenarios según ciclo de nutrientes, erosión, materia orgánica, ruptura del ciclo de plagas, uso de agua, forraje y mercado. Relacionar las estrategias con las prioridades del agricultor. Explicar el papel de leguminosas, cultivos de cobertura, de raíz profunda y tolerantes a sequía.\n- **Mapas y visualización.** Mapas interactivos de tendencias de largo plazo, zonas de vulnerabilidad a nivel de campo, líneas de tiempo, capas superpuestas, deslizadores de escenarios de lluvia o temperatura.\n- **Diseño centrado en el agricultor.** Entendible para personas con poca formación técnica, permite ingresar prioridades y restricciones (agua, maquinaria, mercado) y recuerda dónde importa el criterio humano.\n\n## Nota de vocabulario\n\nEl sitio de Space Apps escribe \"SI\" (Super Intelligence) donde casi todos escriben \"IA\". Su FAQ indica que sigue una Orden Ejecutiva de EE. UU. del 29 de septiembre de 2026. Usamos el término del sitio en el formulario de envío y \"IA/ML\" en nuestras notas técnicas.\n\n## Qué ofrece la pestaña oficial de Recursos\n\nLa pestaña lista 24 recursos. Se dividen en tres grupos, y esa división pesa en dónde hacemos el piloto.\n\n**Cobertura global (sirven en cualquier lugar, incluido Perú)**\n\n| Recurso | Qué aporta | Enlace |\n|---------|------------|--------|\n| SMAP | Humedad superficial del suelo y congelamiento cada 2-3 días | \u003chttps://www.earthdata.nasa.gov/data/platforms/space-based-platforms/smap> |\n| GPM / IMERG | Tasa y acumulado de precipitación | \u003chttps://gpm.nasa.gov/data> |\n| Landsat | Reflectancia a 30 m, NDVI, suelo desnudo | \u003chttps://earthexplorer.usgs.gov/> |\n| MODIS / VIIRS | Índices de vegetación a 250-1000 m | \u003chttps://lpdaac.usgs.gov/products/> |\n| NASA POWER | Agroclimatología: temperatura, humedad, radiación, indicadores derivados | \u003chttps://power.larc.nasa.gov/> |\n| SRTM | Elevación, pendiente, escorrentía, riesgo de erosión | \u003chttps://www.earthdata.nasa.gov/data/instruments/srtm> |\n| ECOSTRESS | Temperatura de superficie y evapotranspiración a escala fina | \u003chttps://ecostress.jpl.nasa.gov/data> |\n| GLDAS | Temperatura, lluvia, humedad del suelo y ET asimiladas | \u003chttps://www.earthdata.nasa.gov/> |\n| GEDI | Altura de dosel y biomasa (mejor en vegetación alta) | \u003chttps://gedi.umd.edu/data> |\n| FAO GAEZ | Aptitud de cultivos, limitantes de suelo, rendimiento potencial | \u003chttps://gaez.fao.org/> |\n| Copernicus Sentinel-2 (ESA) | Imágenes multiespectrales de 10-20 m | \u003chttps://dataspace.copernicus.eu/> |\n| ERA5 (ECMWF) | Variables climáticas horarias de reanálisis | \u003chttps://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels> |\n\n**Solo Estados Unidos**\n\nUSDA Ag Data Commons, Web Soil Survey, Cropland Data Layer (CropScape), PRISM, SSURGO/STATSGO2, NAIP, NLCD, NLDAS, NWIS, USDA AMS Market News, NASS QuickStats, OpenET (estados del oeste), LANDFIRE.\n\n**Solo Norteamérica**\n\nCoCoRaHS, lluvia reportada por voluntarios.\n\n### Por qué importa\n\nMás de la mitad de los recursos listados cubre solo Estados Unidos. Un piloto en Perú puede usar todos los datos de misiones de la NASA, pero debe reemplazar las fuentes estadounidenses de suelo, mapa de cultivos, precios y estaciones por equivalentes peruanos o globales. Ver [6. Decisiones abiertas](06-open-decisions.md).\n\n## Fuentes\n\n- Enunciado del reto y pestaña de Recursos, leídos el 2026-11-14: \u003chttps://www.spaceappschallenge.org/2026/challenges/adapting-farms-with-nasa-data/?tab=resources>\n- Preguntas frecuentes: \u003chttps://www.spaceappschallenge.org/resources/participant-faqs/>\n"}},"02-rules-and-submission":{"en":{"title":"2. Rules, submission and judging","md":"# 2. Rules, submission and judging\n\nRead on 2026-11-14 from the official Participant Guides (all dated November 13, 2026).\n\n## Clock\n\n| When (local time of our event) | What |\n|--------------------------------|------|\n| Sat Nov 14, 9:00 a.m. | Hackathon starts. Project tab appears on the team page. Submission opens. |\n| **Sun Nov 15, 11:59 p.m.** | **Submission closes. Anything saved later is not judged.** |\n| Dec 3, 2026 | Global Nominees announced |\n| Dec 17, 2026 | Global Finalists and Honorable Mentions |\n| Jan 26, 2027 | Global Winners |\n\nFor a Universal Event team the clock follows the Team Owner's local time.\n\nThe FAQ states that teams may not begin working on the challenge before the hackathon starts. Reading the resources and preparing accounts is preparation; building the solution starts at 9:00 a.m.\n\n## Eligibility checklist\n\n- [ ] Every member is registered, confirmed (not waitlisted) in the **same** Local Event, and listed on the team's Members tab.\n- [ ] Team size: 1 to 6 for a Local Event. **A Universal Event team needs at least 2 members.**\n- [ ] Project answers one official challenge.\n- [ ] All required form fields are filled in.\n- [ ] **Everything is in English**: the project page and every linked material. A demo video may be spoken in another language only with English subtitles. Slide decks must be in English.\n- [ ] Demo respects the limit: video of 30 seconds or less, or a deck of 7 slides or fewer including title and intro.\n- [ ] At least one NASA dataset or resource is used (needed for any Global Award).\n- [ ] No images, voices or likeness of anyone under 18.\n- [ ] No affiliation with China or a Chinese-owned entity in connection with the project (NASA policy review).\n- [ ] \"Submit for Judging\" clicked before the deadline. Resubmitting is allowed; the last saved version counts.\n\n## Project page fields\n\n| Field | What to write |\n|-------|---------------|\n| Project Name | Name of the project |\n| High-Level Project Summary | What we built, how it answers the challenge, why it matters |\n| Link to Project Demo | Public link, no login: 30 s video or 7-slide deck |\n| Link to Final Project | Public link, no login: website, repository or hosted files |\n| Detailed Project Description | What it does, how it works, benefits, goals, tools and languages used |\n| Use of Super Intelligence (SI) | Whether and how AI tools were used. Not shown to judges |\n| NASA Data | The specific NASA data and resources used |\n| Space Agency Partner Data and Other References | Every dataset, tool, code, text and image used, including open-source ones |\n\nPractical details:\n\n- Images can be uploaded (JPG, PNG, GIF up to 10 MB). Videos and documents cannot; link them from YouTube, Drive, GitHub or similar and test the link in a private window.\n- If we host on a new domain, the guide recommends requesting a FortiGuard Web Filter classification so judges behind filters can open it: \u003chttps://www.fortiguard.com/faq/wfratingsubmit> (Company Name: \"N/A\").\n- Use the edit \"Lock\" when editing; another member can still overwrite unsaved work.\n\n## Rules on AI (\"SI\") use\n\n- AI tools are allowed to speed up the work. They should not be the source of the idea for how to solve the challenge.\n- Every use must be marked: generated images and videos carry a visible watermark; generated audio, code and data are acknowledged in descriptive text and metadata.\n- Generated content may not use or modify NASA logos, flags or mission identifiers.\n- Judges see those markers and weigh originality, intent and execution.\n\n**Consequence for this repository:** we keep an `AI_USE.md` log and state AI assistance in the README, so the form field can be filled in from it.\n\n## Licensing and citations (Terms and Conditions, updated August 7, 2026)\n\n- Original content must be free of restrictions or under an OSI-approved open-source license. With no license stated, NASA distributes it under **Apache 2.0**.\n- Non-NASA material (data or code) must be free and public or OSI-licensed, and its license must be named in our documentation. NASA will not publish a solution that lacks this.\n- **All sources must be cited, even open ones.** Missing citations can cost a nomination or an award.\n- No commercial promotion, no confidential data, no personally identifiable information.\n- NASA may publish and redistribute the solution, and may use participants' names and likeness for outreach.\n\n**Consequence for this repository:** a `LICENSE` file (Apache 2.0 unless the team chooses another OSI license), and a single references register with license and citation per source: [7. References](07-references.md).\n\n## Judging criteria (each scored 1 to 5)\n\n| Criterion | What earns a 5 | What it means for us |\n|-----------|----------------|----------------------|\n| Impact | A significant problem, wide reach | Name the farmers served and the decision improved |\n| Creativity | A novel approach or a meaningful improvement | The rotation comparison with evidence and gaps is our differentiator |\n| Validity | Scientifically sound, feasible, usable | Published formulas (FAO-56), honest resolution limits, working prototype |\n| Relevance | Directly answers the challenge; **NASA data is integral, not decorative** | NASA series must drive the scores, not sit in a side panel |\n| Presentation | Clear, engaging storytelling in demo and project page | Plan the 30 s demo early and assign an owner |\n\nThe guide stresses that teams tend to neglect Presentation and asks for equal attention to it.\n\n## Global Awards (ten)\n\nBest Use of Science, Best Use of Data, Best Use of Technology, Galactic Impact, Best Mission Concept, Most Inspirational, Best Storytelling, Global Connection, Art & Technology, Local Impact.\n\nThe closest fits for a rotation tool piloted with real farmers are **Local Impact**, **Best Use of Data** and **Best Use of Science**.\n\n## Sources\n\n- Project Submission Guide: \u003chttps://www.spaceappschallenge.org/resources/project-submission-guide/>\n- Judging & Awards Guide: \u003chttps://www.spaceappschallenge.org/resources/judging-awards-guide/>\n- Participant FAQs: \u003chttps://www.spaceappschallenge.org/resources/participant-faqs/>\n- Terms and Conditions: \u003chttps://www.spaceappschallenge.org/legal/>\n"},"es":{"title":"2. Reglas, envío y evaluación","md":"# 2. Reglas, envío y evaluación\n\nLeído el 2026-11-14 en las Guías del Participante oficiales (todas con fecha 13 de noviembre de 2026).\n\n## Reloj\n\n| Cuándo (hora local de nuestro evento) | Qué pasa |\n|---------------------------------------|----------|\n| Sáb 14 nov, 9:00 a. m. | Empieza el hackatón. Aparece la pestaña Project en la página del equipo. Se abre el envío. |\n| **Dom 15 nov, 11:59 p. m.** | **Cierra el envío. Lo guardado después no se evalúa.** |\n| 3 dic 2026 | Se anuncian los Nominados Globales |\n| 17 dic 2026 | Finalistas Globales y Menciones Honrosas |\n| 26 ene 2027 | Ganadores Globales |\n\nPara un equipo del Evento Universal el reloj sigue la hora local del dueño del equipo.\n\nEl FAQ indica que los equipos no pueden empezar a trabajar en el reto antes del inicio del hackatón. Leer los recursos y preparar cuentas es preparación; construir la solución empieza a las 9:00 a. m.\n\n## Lista de elegibilidad\n\n- [ ] Todos los miembros están registrados, confirmados (no en lista de espera) en el **mismo** Evento Local y figuran en la pestaña Members del equipo.\n- [ ] Tamaño del equipo: de 1 a 6 en un Evento Local. **Un equipo del Evento Universal necesita al menos 2 miembros.**\n- [ ] El proyecto responde a un reto oficial.\n- [ ] Todos los campos obligatorios del formulario están llenos.\n- [ ] **Todo está en inglés**: la página del proyecto y cada material enlazado. El video demo puede hablarse en otro idioma solo con subtítulos en inglés. Las diapositivas deben estar en inglés.\n- [ ] El demo respeta el límite: video de 30 segundos o menos, o presentación de 7 diapositivas o menos incluyendo título e introducción.\n- [ ] Se usa al menos un dato o recurso de la NASA (requisito para cualquier Premio Global).\n- [ ] Sin imágenes, voces ni apariencia de menores de 18 años.\n- [ ] Sin afiliación con China o entidades de propiedad china en relación con el proyecto (revisión por política de la NASA).\n- [ ] Clic en \"Submit for Judging\" antes del cierre. Se puede reenviar; cuenta la última versión guardada.\n\n## Campos de la página del proyecto\n\n| Campo | Qué escribir |\n|-------|--------------|\n| Project Name | Nombre del proyecto |\n| High-Level Project Summary | Qué construimos, cómo responde al reto, por qué importa |\n| Link to Project Demo | Enlace público sin login: video de 30 s o 7 diapositivas |\n| Link to Final Project | Enlace público sin login: sitio web, repositorio o archivos alojados |\n| Detailed Project Description | Qué hace, cómo funciona, beneficios, metas, herramientas y lenguajes usados |\n| Use of Super Intelligence (SI) | Si se usaron herramientas de IA y cómo. Los jueces no lo ven |\n| NASA Data | Los datos y recursos específicos de la NASA utilizados |\n| Space Agency Partner Data and Other References | Todo dato, herramienta, código, texto e imagen usados, incluso los de código abierto |\n\nDetalles prácticos:\n\n- Se pueden subir imágenes (JPG, PNG, GIF hasta 10 MB). Videos y documentos no; se enlazan desde YouTube, Drive, GitHub o similar, y conviene probar el enlace en una ventana privada.\n- Si alojamos en un dominio nuevo, la guía recomienda pedir una clasificación de FortiGuard Web Filter para que los jueces detrás de filtros puedan abrirlo: \u003chttps://www.fortiguard.com/faq/wfratingsubmit> (Company Name: \"N/A\").\n- Usar el \"Lock\" de edición al editar; otro miembro aún puede sobrescribir trabajo no guardado.\n\n## Reglas sobre el uso de IA (\"SI\")\n\n- Las herramientas de IA están permitidas para acelerar el trabajo. No deben ser el origen de la idea de cómo resolver el reto.\n- Todo uso debe marcarse: imágenes y videos generados llevan marca de agua visible; audio, código y datos generados se reconocen en texto descriptivo y metadatos.\n- El contenido generado no puede usar ni modificar logos, banderas ni identificadores de misión de la NASA.\n- Los jueces ven esas marcas y valoran originalidad, intención y ejecución.\n\n**Consecuencia para este repositorio:** llevamos un registro `AI_USE.md` y declaramos la asistencia de IA en el README, para llenar el campo del formulario a partir de ahí.\n\n## Licencias y citas (Términos y Condiciones, actualizados el 7 de agosto de 2026)\n\n- El contenido original debe estar libre de restricciones o bajo una licencia de código abierto aprobada por la OSI. Si no se indica licencia, la NASA lo distribuye bajo **Apache 2.0**.\n- El material que no es de la NASA (datos o código) debe ser libre y público o con licencia OSI, y su licencia debe nombrarse en nuestra documentación. La NASA no publica soluciones que no lo cumplan.\n- **Todas las fuentes deben citarse, incluso las abiertas.** La falta de citas puede costar una nominación o un premio.\n- Sin promoción comercial, sin datos confidenciales, sin información personal identificable.\n- La NASA puede publicar y redistribuir la solución, y usar nombres e imagen de los participantes para difusión.\n\n**Consecuencia para este repositorio:** un archivo `LICENSE` (Apache 2.0 salvo que el equipo elija otra licencia OSI) y un único registro de referencias con licencia y cita por fuente: [7. Referencias](07-references.md).\n\n## Criterios de evaluación (cada uno de 1 a 5)\n\n| Criterio | Qué obtiene un 5 | Qué significa para nosotros |\n|----------|------------------|-----------------------------|\n| Impacto | Un problema importante, alcance amplio | Nombrar a los agricultores atendidos y la decisión que mejora |\n| Creatividad | Un enfoque nuevo o una mejora significativa | La comparación de rotaciones con evidencia y vacíos es nuestro diferencial |\n| Validez | Sólido científicamente, factible, usable | Fórmulas publicadas (FAO-56), límites de resolución honestos, prototipo que funciona |\n| Relevancia | Responde directo al reto; **los datos de la NASA son parte integral, no decoración** | Las series de la NASA deben mover los puntajes, no quedar en un panel lateral |\n| Presentación | Narrativa clara y atractiva en el demo y la página | Planificar el demo de 30 s temprano y asignarle un responsable |\n\nLa guía insiste en que los equipos suelen descuidar la Presentación y pide darle la misma atención.\n\n## Premios Globales (diez)\n\nBest Use of Science, Best Use of Data, Best Use of Technology, Galactic Impact, Best Mission Concept, Most Inspirational, Best Storytelling, Global Connection, Art & Technology, Local Impact.\n\nLos que mejor calzan con una herramienta de rotación piloteada con agricultores reales son **Local Impact**, **Best Use of Data** y **Best Use of Science**.\n\n## Fuentes\n\n- Guía de envío del proyecto: \u003chttps://www.spaceappschallenge.org/resources/project-submission-guide/>\n- Guía de evaluación y premios: \u003chttps://www.spaceappschallenge.org/resources/judging-awards-guide/>\n- Preguntas frecuentes: \u003chttps://www.spaceappschallenge.org/resources/participant-faqs/>\n- Términos y Condiciones: \u003chttps://www.spaceappschallenge.org/legal/>\n"}},"03-architecture":{"en":{"title":"3. Architecture","md":"# 3. Architecture\n\nDecided with the team owner on 2026-11-14. Data access behind each source was tested live: see `research/01_api_tests.md`.\n\n## One product, one world\n\n- **Index (landing):** a live Three.js globe at sunrise with real NASA imagery (Blue Marble, VIIRS night lights). Scrolling dives from orbit to the valley. A frosted-glass phone in front shows the app in use. Approved reference: `design-directions/approved-index-hero.webp`.\n- **App:** the same world continues. The background becomes the farmer's own field from above; the interface is frosted glass floating over it.\n- **Same features on phone and desktop:** location (GPS, map point or drawn outline, place search), up to 10 photos per message (camera or drag and drop), chat with the consultant, result sections, dashboard, export.\n\n## Components\n\n| Layer | Choice | Why |\n|-------|--------|-----|\n| Frontend | TypeScript, HTML, CSS; Three.js for the globe; a web map for the field | Owner's choice; one responsive web app (installable PWA) for phone and desktop |\n| Backend | Rust | Owner's standing preference; fast, single binary |\n| Database | MariaDB 11.4 LTS | Owner's choice; open source (GPL); spatial types for field outlines; good Rust support (`sqlx`) |\n| Files | Server disk or Google Cloud Storage | Photos and exported PDFs stay out of the database |\n| AI consultant | Claude through the Anthropic API | Two stages: an analyst stage builds a fixed evidence package from NASA and catalog data; the consultant presents it and may only cite its numbers |\n| Hosting | One Google Compute Engine e2-micro VM (always-free tier) running the Rust API, MariaDB and an HTTPS web server | Free for the whole judging period (through January 2027); one public URL on the GoDaddy domain |\n\n## What MariaDB stores\n\n- Analyses: field outline, location mode (GPS or example site), crop history, priorities.\n- Conversation turns and the state of each result section.\n- References to photos (the files live outside the database).\n- Generated reports, for the share link.\n- A cache of NASA responses, so the demo stays fast and keeps working if a service is slow during judging.\n\n## Data sources by access\n\n| Access | Sources |\n|--------|---------|\n| No account | NASA POWER; Planetary Computer (Sentinel-2, Landsat, NASADEM, MODIS, NEX-GDDP-CMIP6, ERA5); NASA GIBS map layers; NASA CMR search |\n| Earthdata Login token (owner's, stored in `env.txt`) | SMAP L4 soil moisture (NSIDC), IMERG Late daily rainfall (GES DISC), GRACE/GRACE-FO mascons (PO.DAAC) |\n\n## Secrets\n\n`env.txt` (API keys) and `infra/.env` (database passwords) are git-ignored and never printed in logs or chat.\n\n## Privacy\n\nLocations and crop photos are personal data. Analyses are deleted after a retention period, except the example sites, and the app says so.\n\n## Open items\n\n- Confirm the license of each NEX-GDDP-CMIP6 model used.\n- Extract the GRACE series once per example site (netCDF reader in the backend or a one-off tool).\n"},"es":{"title":"3. Arquitectura","md":"# 3. Arquitectura\n\nDecidida con el dueño del equipo el 2026-11-14. El acceso a cada fuente de datos se probó en vivo: ver `research/01_api_tests.md`.\n\n## Un producto, un mundo\n\n- **Index (portada):** un globo vivo en Three.js al amanecer con imágenes reales de la NASA (Blue Marble, luces nocturnas de VIIRS). Al bajar, la cámara desciende de la órbita al valle. Al frente, un teléfono de vidrio esmerilado muestra la app en uso. Referencia aprobada: `design-directions/approved-index-hero.webp`.\n- **App:** el mismo mundo continúa. El fondo pasa a ser el propio lote del agricultor visto desde arriba; la interfaz es vidrio esmerilado flotando encima.\n- **Mismas funciones en celular y escritorio:** ubicación (GPS, punto en el mapa o contorno dibujado, búsqueda de lugar), hasta 10 fotos por mensaje (cámara o arrastrar y soltar), chat con el consultor, apartados de resultados, dashboard y exportación.\n\n## Componentes\n\n| Capa | Elección | Por qué |\n|------|----------|---------|\n| Frontend | TypeScript, HTML, CSS; Three.js para el globo; un mapa web para el lote | Elección del dueño; una sola app web adaptable (PWA instalable) para celular y escritorio |\n| Backend | Rust | Preferencia permanente del dueño; rápido, un solo binario |\n| Base de datos | MariaDB 11.4 LTS | Elección del dueño; código abierto (GPL); tipos geográficos para los contornos; buen soporte en Rust (`sqlx`) |\n| Archivos | Disco del servidor o Google Cloud Storage | Fotos y PDF exportados quedan fuera de la base de datos |\n| Consultor IA | Claude vía la API de Anthropic | Dos etapas: un analista arma un paquete fijo de evidencia con datos NASA y del catálogo; el consultor lo presenta y solo puede citar sus cifras |\n| Hosting | Una máquina virtual e2-micro de Google Compute Engine (capa gratuita permanente) con la API en Rust, MariaDB y un servidor web HTTPS | Gratis durante toda la evaluación (hasta enero de 2027); una URL pública en el dominio de GoDaddy |\n\n## Qué guarda MariaDB\n\n- Análisis: contorno del lote, modo de ubicación (GPS o sitio de ejemplo), historial de cultivos, prioridades.\n- Turnos de la conversación y el estado de cada apartado.\n- Referencias a las fotos (los archivos viven fuera de la base de datos).\n- Reportes generados, para el enlace compartible.\n- Una caché de las respuestas de la NASA, para que el demo sea rápido y siga funcionando si un servicio está lento durante la evaluación.\n\n## Fuentes de datos según acceso\n\n| Acceso | Fuentes |\n|--------|---------|\n| Sin cuenta | NASA POWER; Planetary Computer (Sentinel-2, Landsat, NASADEM, MODIS, NEX-GDDP-CMIP6, ERA5); capas de mapa NASA GIBS; búsqueda NASA CMR |\n| Token de Earthdata Login (del dueño, guardado en `env.txt`) | Humedad del suelo SMAP L4 (NSIDC), lluvia diaria IMERG Late (GES DISC), masas de agua GRACE/GRACE-FO (PO.DAAC) |\n\n## Secretos\n\n`env.txt` (claves de API) e `infra/.env` (contraseñas de la base de datos) están fuera de git y nunca se muestran en registros ni en el chat.\n\n## Privacidad\n\nLas ubicaciones y las fotos de cultivos son datos personales. Los análisis se borran tras un periodo de retención, salvo los sitios de ejemplo, y la app lo informa.\n\n## Pendientes\n\n- Confirmar la licencia de cada modelo NEX-GDDP-CMIP6 que se use.\n- Extraer una vez la serie de GRACE por sitio de ejemplo (lector de netCDF en el backend o una herramienta puntual).\n"}},"05-global-offers":{"en":{"title":"5. Global Offers","md":"# 5. Global Offers\n\nRead on 2026-11-14 from the logged-in offers page: \u003chttps://www.spaceappschallenge.org/2026/global-offers/>\n\n## How to claim\n\nLog in at spaceappschallenge.org, click the avatar, choose **Offers**, open the offer and press **Claim Offer**. Each button opens the provider's own site; nothing is activated inside Space Apps. All offers are optional. Questions go to the support contact on each offer or to the Global Offers category of Space Apps Connect: \u003chttps://github.com/nasa/spaceapps/discussions/categories/global-offers>\n\n## The offers at a glance\n\n| Offer | What you get | Needs a card | Claim link |\n|-------|--------------|--------------|------------|\n| GoDaddy Registry: domain and hosting | One free non-premium domain, one year of website hosting and an SSL certificate for that year | Not stated | \u003chttps://www.spaceapps.earth/> |\n| Google Cloud | The standard free trial: 300 USD of credit for 90 days, no automatic charge afterwards | Yes, for identity check | \u003chttps://cloud.google.com/free/docs/free-cloud-features#free-trial> |\n| Microsoft Azure | The standard free account for new customers: 200 USD of credit for 30 days plus the always-free and 12-month-free services | Yes, non-prepaid, plus a phone number | \u003chttps://azure.microsoft.com/en-us/free/> |\n| Microsoft Planetary Computer | Public data catalog and STAC API, no account required; some requests need a free token | No | \u003chttps://planetarycomputer.microsoft.com/> |\n| GitHub Copilot | The Free plan: up to 2,000 completions per month, limited chat and agent use | No | \u003chttps://github.com/features/copilot> |\n| Microsoft Copilot | Free assistant at copilot.com | No | \u003chttps://www.microsoft.com/en-us/microsoft-copilot> |\n| Microsoft Teams | Teams Free: 100 participants, 60-minute meetings, 5 GB per user | No | \u003chttps://www.microsoft.com/en-us/microsoft-teams/teams-free> |\n| Meteomatics Weather API | 1,000 queries per day on all API features, **only for the duration of the hackathon** | No | \u003chttps://www.meteomatics.com/en/meteomatics-and-nasa-space-apps-challenge/> |\n| Miro Education | Free for two years for students | No | \u003chttps://miro.com/education-whiteboard/> |\n| Miro Business | 14-day trial; cancel before it ends to avoid charges | Yes | \u003chttps://miro.com/pricing/> |\n| Miro templates | Hackathon and Project Coach boards | No | \u003chttps://miro.com/templates/profile/nasa-space-apps-challenge/> |\n\n## GoDaddy domain, step by step\n\nThis is the only offer with its own claim flow. The page describes four steps:\n\n1. Open \u003chttps://www.spaceapps.earth/> and search for the domain name. Only non-premium domains are free.\n2. Fill in contact details with a valid email address.\n3. Read the email and enter the \"launch code\" it contains.\n4. Finish the free registration with **Porkbun**, GoDaddy's registration partner.\n\nSupport: support@porkbun.com. The page does not say which domain endings are included; the claim site itself is on `.earth`, so that is the likely ending (not confirmed).\n\nCompleting the flow creates a Porkbun account and enters personal contact data, so the team owner does it personally.\n\n## What this means for the project\n\n- **Google Cloud and Azure are the ordinary public free trials.** They are for new customers only: an account that already used its trial gets no new credit. Both ask for a card.\n- **Planetary Computer needs no claim at all.** Its STAC API is the fastest listed route to Landsat, Sentinel-2 and MODIS without creating anything.\n- **Meteomatics stops when the hackathon ends**, while judging runs until January 2027. A public demo that depends on it would break for the judges. It is also proprietary data, not NASA data. Use it at most for a one-off comparison, with the result saved.\n- **A free domain gives the project a clean public URL** for the \"Link to Final Project\" field. A new domain should get a FortiGuard classification request: \u003chttps://www.fortiguard.com/faq/wfratingsubmit>\n- The final project link must open without login, and every non-NASA service used must appear in the references with its license.\n\n## Still open\n\n- [ ] Domain endings and renewal price after the free year.\n- [ ] Whether the hosting is required or the domain can point elsewhere by DNS.\n- [ ] Whether the team owner's Google and Microsoft accounts are still eligible for the new-customer credits.\n\n## Sources\n\n- Global Offers page (login required): \u003chttps://www.spaceappschallenge.org/2026/global-offers/>\n- GO Team kickoff message, saved in `Docs/Correo.txt`\n- Space Apps Connect discussion 2035: \u003chttps://github.com/nasa/spaceapps/discussions/2035>\n- Project Submission Guide: \u003chttps://www.spaceappschallenge.org/resources/project-submission-guide/>\n"},"es":{"title":"5. Ofertas Globales","md":"# 5. Ofertas Globales\n\nLeído el 2026-11-14 en la página de ofertas con sesión iniciada: \u003chttps://www.spaceappschallenge.org/2026/global-offers/>\n\n## Cómo reclamar\n\nIniciar sesión en spaceappschallenge.org, clic en el avatar, elegir **Offers**, abrir la oferta y presionar **Claim Offer**. Cada botón abre el sitio del proveedor; nada se activa dentro de Space Apps. Todas las ofertas son opcionales. Las dudas van al contacto de soporte de cada oferta o a la categoría Global Offers de Space Apps Connect: \u003chttps://github.com/nasa/spaceapps/discussions/categories/global-offers>\n\n## Las ofertas de un vistazo\n\n| Oferta | Qué recibes | Pide tarjeta | Enlace para reclamar |\n|--------|-------------|--------------|----------------------|\n| GoDaddy Registry: dominio y hosting | Un dominio no premium gratis, un año de hosting web y certificado SSL por ese año | No se indica | \u003chttps://www.spaceapps.earth/> |\n| Google Cloud | La prueba gratuita estándar: 300 USD de crédito por 90 días, sin cobro automático después | Sí, para verificar identidad | \u003chttps://cloud.google.com/free/docs/free-cloud-features#free-trial> |\n| Microsoft Azure | La cuenta gratuita estándar para clientes nuevos: 200 USD de crédito por 30 días más los servicios siempre gratuitos y los gratuitos por 12 meses | Sí, no prepago, más un teléfono | \u003chttps://azure.microsoft.com/en-us/free/> |\n| Microsoft Planetary Computer | Catálogo de datos y API STAC públicos, sin cuenta; algunas solicitudes piden un token gratuito | No | \u003chttps://planetarycomputer.microsoft.com/> |\n| GitHub Copilot | El plan Free: hasta 2 000 autocompletados al mes, chat y agente limitados | No | \u003chttps://github.com/features/copilot> |\n| Microsoft Copilot | Asistente gratuito en copilot.com | No | \u003chttps://www.microsoft.com/en-us/microsoft-copilot> |\n| Microsoft Teams | Teams Free: 100 participantes, reuniones de 60 minutos, 5 GB por usuario | No | \u003chttps://www.microsoft.com/en-us/microsoft-teams/teams-free> |\n| Meteomatics Weather API | 1 000 consultas diarias en todas las funciones de la API, **solo mientras dura el hackatón** | No | \u003chttps://www.meteomatics.com/en/meteomatics-and-nasa-space-apps-challenge/> |\n| Miro Education | Gratis dos años para estudiantes | No | \u003chttps://miro.com/education-whiteboard/> |\n| Miro Business | Prueba de 14 días; cancelar antes para evitar cobros | Sí | \u003chttps://miro.com/pricing/> |\n| Plantillas de Miro | Tableros Hackathon y Project Coach | No | \u003chttps://miro.com/templates/profile/nasa-space-apps-challenge/> |\n\n## Dominio de GoDaddy, paso a paso\n\nEs la única oferta con un flujo propio. La página describe cuatro pasos:\n\n1. Abrir \u003chttps://www.spaceapps.earth/> y buscar el nombre de dominio. Solo los dominios no premium son gratis.\n2. Llenar los datos de contacto con un correo válido.\n3. Revisar el correo e ingresar el \"launch code\" que llega.\n4. Terminar el registro gratuito con **Porkbun**, el socio registrador de GoDaddy.\n\nSoporte: support@porkbun.com. La página no dice qué extensiones incluye; el sitio para reclamar está en `.earth`, así que esa es la extensión probable (sin confirmar).\n\nCompletar el flujo crea una cuenta en Porkbun e ingresa datos personales de contacto, así que lo hace el dueño del equipo en persona.\n\n## Qué significa para el proyecto\n\n- **Google Cloud y Azure son las pruebas gratuitas públicas de siempre.** Son solo para clientes nuevos: una cuenta que ya usó su prueba no recibe crédito nuevo. Ambas piden tarjeta.\n- **Planetary Computer no requiere reclamar nada.** Su API STAC es la vía listada más rápida a Landsat, Sentinel-2 y MODIS sin crear cuentas.\n- **Meteomatics se corta cuando termina el hackatón**, y la evaluación dura hasta enero de 2027. Un demo público que dependa de él se rompería ante los jueces. Además son datos propietarios, no de la NASA. Usarlo como mucho para una comparación puntual, guardando el resultado.\n- **Un dominio gratis le da al proyecto una URL pública limpia** para el campo \"Link to Final Project\". A un dominio nuevo conviene pedirle la clasificación de FortiGuard: \u003chttps://www.fortiguard.com/faq/wfratingsubmit>\n- El enlace del proyecto final debe abrir sin login, y todo servicio que no sea de la NASA debe figurar en las referencias con su licencia.\n\n## Aún abierto\n\n- [ ] Extensiones de dominio y precio de renovación tras el año gratis.\n- [ ] Si el hosting es obligatorio o el dominio puede apuntar a otro lado por DNS.\n- [ ] Si las cuentas de Google y Microsoft del dueño del equipo aún califican para los créditos de cliente nuevo.\n\n## Fuentes\n\n- Página de Ofertas Globales (requiere login): \u003chttps://www.spaceappschallenge.org/2026/global-offers/>\n- Mensaje de inicio del GO Team, guardado en `Docs/Correo.txt`\n- Discusión 2035 de Space Apps Connect: \u003chttps://github.com/nasa/spaceapps/discussions/2035>\n- Guía de envío del proyecto: \u003chttps://www.spaceappschallenge.org/resources/project-submission-guide/>\n"}}},"built":"2026-11-14"}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>// Handbook viewer: English by default, Spanish on demand. Data is embedded by build.mjs.
const DATA = JSON.parse(document.getElementById('pages').textContent);
const UI = {
  en: { tagline: 'Team handbook · NASA Space Apps 2026', built: 'Built', missing: 'This page has no English version yet.' },
  es: { tagline: 'Manual del equipo · NASA Space Apps 2026', built: 'Generado', missing: 'Esta página aún no tiene versión en español.' },
};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } },
};
let lang = store.get('handbook.lang') === 'es' ? 'es' : 'en';
let slug = (location.hash || '').slice(1) || DATA.order[0];

function render() {
  if (!DATA.order.includes(slug)) slug = DATA.order[0];
  document.documentElement.lang = lang;
  document.getElementById('tagline').textContent = UI[lang].tagline;
  document.querySelectorAll('.lang button').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));

  const nav = document.getElementById('nav');
  nav.replaceChildren(...DATA.order.map((s) => {
    const a = document.createElement('a');
    const p = DATA.pages[s][lang] || DATA.pages[s].en;
    a.href = '#' + s;
    a.textContent = p.title;
    if (s === slug) a.setAttribute('aria-current', 'page');
    return a;
  }));

  const page = DATA.pages[slug][lang];
  const el = document.getElementById('page');
  if (!page) {
    el.textContent = UI[lang].missing;
  } else if (window.marked) {
    el.innerHTML = window.marked.parse(page.md);
  } else {
    const pre = document.createElement('pre');
    pre.textContent = page.md;
    el.replaceChildren(pre);
  }
  el.querySelectorAll('table').forEach((t) => {
    const w = document.createElement('div');
    w.className = 'table-wrap';
    t.replaceWith(w);
    w.append(t);
  });
  el.querySelectorAll('a[href]').forEach((a) => {
    const href = a.getAttribute('href');
    const m = /^([\w-]+)\.md(#.*)?$/.exec(href);
    if (m && DATA.pages[m[1]]) a.setAttribute('href', '#' + m[1]);
    else if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  document.getElementById('foot').textContent = UI[lang].built + ' ' + DATA.built;
  document.title = (page ? page.title : slug) + ' · Field Shift';
}

document.querySelectorAll('.lang button').forEach((b) =>
  b.addEventListener('click', () => { lang = b.dataset.lang; store.set('handbook.lang', lang); render(); }));
window.addEventListener('hashchange', () => { slug = location.hash.slice(1); render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
